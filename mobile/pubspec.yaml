name: ai_style_companion
description: AI-Powered Personal Styling & Virtual Fashion Assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # State management
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.3.2

  # Image picker for wardrobe upload
  image_picker: ^1.1.2

  # UI helpers
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
